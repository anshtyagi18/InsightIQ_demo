version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightia-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
    networks:
      - insightia-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightia-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - insightia-network
    restart: unless-stopped

networks:
  insightia-network:
    driver: bridge

volumes:
  backend-uploads:
